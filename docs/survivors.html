<footer>Data is community/manually sourced — see confidence notes on trivia pages.</footer>

<script src="js/app.js"></script>
<script>
  loadAndRender("data/survivors.json", "survivors-grid", (s) => el(`
    <div class="card survivor">
      ${s.usage_rank ? `<span class="rank">#${s.usage_rank} used</span>` : ""}
      <h3>${s.name}</h3>
      ${s.death_rank ? `<p>Death rank: #${s.death_rank}</p>` : ""}
      ${(s.common_perks_used || []).map(p => `<span class="tag">${p}</span>`).join("")}
    </div>
  `));
</script>
