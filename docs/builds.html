<script src="js/app.js"></script>
<script>
  loadAndRender("data/builds.json", "builds-grid", (b) => el(`
    <div class="card${b.side === "survivor" ? " survivor" : ""}">
      <span class="rank">${b.category}</span>
      <h3>${b.name}</h3>
      <p>${b.why_it_works || ""}</p>
      ${(b.perks || []).map(p => `<span class="tag">${p}</span>`).join("")}
    </div>
  `));
</script>
