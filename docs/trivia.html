  <h2>Trivia — Fun Facts & Records</h2>
  <div class="grid" id="trivia-grid"></div>
</main>

<footer>Data is community/manually sourced — confidence noted per fact.</footer>

<script src="js/app.js"></script>
<script>
  loadAndRender("data/trivia.json", "trivia-grid", (t) => el(`
    <div class="card">
      <span class="rank">${t.confidence}</span>
      <h3>${t.title}</h3>
      <p>${t.stat_value || ""}</p>
      <p style="color:#888;font-size:0.85rem">${t.category || ""}</p>
    </div>
  `));
</script>
