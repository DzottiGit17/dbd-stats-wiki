<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  loadAndRender("data/trivia.json", "trivia-grid", (t) => el(`
    <div class="card h-100"><div class="card-body">
      <span class="tag">${t.confidence}</span>
      <h3 class="card-title mt-2">${t.title}</h3>
      <p class="card-text">${t.stat_value || ""}</p>
      <p class="text-muted small">${t.category || ""}</p>
    </div></div>
  `));
</script>
