<script src="js/app.js"></script>
<script>
  loadAndRender("data/perks.json", "perks-grid", (p) => el(`
    <div class="card${p.side === "survivor" ? " survivor" : ""}">
      ${p.usage_rank ? `<span class="rank">#${p.usage_rank} ${p.side}</span>` : ""}
      <h3>${p.name}</h3>
      <p>${p.effect || ""}</p>
      <span class="tag">${p.origin_character || "general"}</span>
    </div>
  `));
</script>
