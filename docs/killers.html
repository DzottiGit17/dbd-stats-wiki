  <h2 class="page-title">Killers — Usage Rankings</h2>

<footer class="text-center py-5">Data is community/manually sourced — see confidence notes on trivia pages. Perk/character art © Behaviour Interactive, via Dead by Daylight Wiki (fan use, unofficial).</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  loadAndRender("data/killers.json", "killers-grid", (k) => el(`
    <div class="card h-100"><div class="card-body">
      ${k.icon ? `<img class="entity-icon" src="${k.icon}" alt="${k.name} icon" loading="lazy">` : ""}
      ${k.usage_rank ? `<span class="rank">#${k.usage_rank}</span>` : ""}
      <h3 class="card-title">${k.name}</h3>
      <p class="card-text">${k.power || ""}</p>
      ${k.usage_rate_pct != null ? `<span class="tag">${k.usage_rate_pct}% pick rate</span>` : ""}
      ${k.kill_rate_pct != null ? `<span class="tag">${k.kill_rate_pct}% kill rate</span>` : ""}
      ${(k.common_perks_used || []).map(p => `<span class="tag">${p}</span>`).join("")}
    </div></div>
  `));
</script>
