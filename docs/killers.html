<footer>Data is community/manually sourced — see confidence notes on trivia pages.</footer>

<script src="js/app.js"></script>
<script>
  loadAndRender("data/killers.json", "killers-grid", (k) => el(`
    <div class="card">
      ${k.usage_rank ? `<span class="rank">#${k.usage_rank} used</span>` : ""}
      <h3>${k.name}</h3>
      <p>${k.power || ""}</p>
      ${(k.common_perks_used || []).map(p => `<span class="tag">${p}</span>`).join("")}
    </div>
  `));
</script>
